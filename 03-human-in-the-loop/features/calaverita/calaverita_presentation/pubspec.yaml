name: calaverita_presentation
description: The details, the stage and the skull portrait of the calaverita screen.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  ack: ^1.7.0
  app_ui: any
  calaverita_domain: any
  copilotkit_flutter: any
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  provider: ^6.1.5

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/skull/base/
    - assets/skull/pattern/
    - assets/skull/eyes/
    - assets/skull/nose/
    - assets/skull/mouth/
    - assets/skull/mustache/
    - assets/skull/glasses/
    - assets/skull/flowers/
    - assets/skull/hat/
