include: package:very_good_analysis/analysis_options.yaml
analyzer:
  exclude:
    - build/**
    - web/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
linter:
  rules:
    # The workshop uses classic constructors; Dart 3.13 offers shorthands.
    prefer_initializing_formals: false
    unnecessary_type_name_in_constructor: false
    # A workshop app doesn't need an API reference.
    public_member_api_docs: false
