# Checks a change to the shared backend before it can reach main.
name: runtime_ci

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime_ci.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Typecheck
        working-directory: runtime
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Test the password gate
        working-directory: runtime
        run: npm test

      - name: Build the image
        run: docker build --tag calaverita-runtime runtime
