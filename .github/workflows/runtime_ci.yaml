# Checks a change to the shared backend before it can reach main.
name: runtime_ci

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime_ci.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Typecheck
        working-directory: runtime
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Build the image
        run: docker build --tag calaverita-runtime runtime
